<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <title>Daylight — your workday</title>
  </head>
  <body>
    <div id="root">
      <main style="max-width: 560px; margin: 15vh auto; padding: 24px; font-family: system-ui, sans-serif; color: #252724">
        <h1>Daylight</h1>
        <p id="startup-message">Starting your workday...</p>
        <button id="startup-reload" hidden onclick="window.location.reload()">Reload</button>
        <noscript>Enable JavaScript to open Daylight.</noscript>
      </main>
    </div>
    <script>
      function showStartupError() {
        const message = document.getElementById('startup-message');
        if (!message) return;
        message.textContent = "Daylight couldn't load. Check your connection and reload.";
        document.getElementById('startup-reload').hidden = false;
      }
      window.addEventListener('error', showStartupError, true);
      window.setTimeout(showStartupError, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
